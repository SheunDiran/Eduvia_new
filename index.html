<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eduvia — AI-Powered High School Learning Platform</title>
    <meta name="description" content="AI-powered learning platform for high school students with curated 3-video topic playlists, Eduvia AI misconception diagnosis, timed tests, and student productivity tools." />
    <meta property="og:title" content="Eduvia — AI-Powered High School Learning Platform" />
    <meta property="og:description" content="AI-powered learning platform for high school students with curated 3-video topic playlists, Eduvia AI misconception diagnosis, timed tests, and student productivity tools." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('eduvia_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#030712';
            document.documentElement.style.color = '#ffffff';
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFC] dark:bg-[#030712] text-slate-900 dark:text-white font-['Plus_Jakarta_Sans',sans-serif] antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
