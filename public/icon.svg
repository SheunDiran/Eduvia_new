<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" />

  <!-- Graduation Cap Icon in Center with Filter -->
  <g filter="url(#shadow)" transform="translate(64, 88)">
    <!-- Cap Rhombus Top -->
    <path d="M192 48 L352 128 L192 208 L32 128 Z" fill="#ffffff" />
    
    <!-- Cap Under Skullcap -->
    <path d="M102 165 L102 248 C102 292, 282 292, 282 248 L282 165 L192 210 Z" fill="#f1f5f9" />
    
    <!-- Tassel String and Pendant -->
    <path d="M304 152 L340 220 L340 280" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="340" cy="292" r="14" fill="#38bdf8" />
  </g>

  <!-- AI Sparkle in top right corner -->
  <g transform="translate(360, 96)">
    <path d="M0 -36 C0 0, 0 0, 36 0 C0 0, 0 0, 0 36 C0 0, 0 0, -36 0 C0 0, 0 0, 0 -36 Z" fill="#facc15" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>
</svg>
